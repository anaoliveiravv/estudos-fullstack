<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de matrícula</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <main>
            <div class="main-container">
                <div class="back">
                    <img src="assets/icons/arrow-left-02.svg" alt="icone de voltar">
                    <span>Voltar</span>
                </div>

                <h1>Formulário de matrícula</h1>
                <p>Preencha os dados abaixo para matricular seu filho na escola de educação infantil Estrelas do Amanhã.</p>
            </div>
        </main>
        <aside>
            <div class="aside-container">
                <header>
                    <img src="assets/logo.svg" alt="logo estrelas do Amanhã">
                    <h2>
                        Porque cada momento de <strong>aprendizado</strong> conta
                    </h2> <!-- h2 ja fica em negrito automaticamente mesmo sem o strong-->
                    <p>Inscreva seu filho em nossa escola e veja-o florescer em um ambiente acolhedor, seguro e estimulante.</p>
                </header>

                <img src="assets/Illustration.svg" alt="ilustracao de professor com crianças">
            </div>
        </aside>
    </div>
</body>
</html>
